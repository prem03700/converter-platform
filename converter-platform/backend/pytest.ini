[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show short-form tracebacks by default; use -v for verbose
addopts = --tb=short -q

filterwarnings =
    # Third-party deprecations we can't fix (passlib/crypt, SwigPy, jose/utcnow)
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:jose.*
    ignore::DeprecationWarning:sqlalchemy.*
    # Suppress low-level C extension warnings from PyMuPDF / swig
    ignore:builtin type.*has no __module__:DeprecationWarning
