
# ── Shared environment ──────────────────────────────────────────────────────
x-backend-env: &backend-env
  ENV: production
  DEBUG: "false"
  DATABASE_URL: postgresql://converter:${POSTGRES_PASSWORD}@postgres:5432/converter
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  RUN_TASKS_EAGERLY: "false"
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  LOCAL_STORAGE_PATH: /app/storage_data
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  CORS_ORIGINS: '["${FRONTEND_URL:-http://localhost:5173}"]'
  MAX_UPLOAD_SIZE_MB: "200"
  # S3 — only required when STORAGE_BACKEND=s3
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}


services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: converter
      POSTGRES_USER: converter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U converter"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ───────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-env
    volumes:
      - storage_data:/app/storage_data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Celery Worker ─────────────────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    environment:
      <<: *backend-env
    volumes:
      - storage_data:/app/storage_data
    depends_on:
      - api
      - redis
      - postgres

  # ── Celery Beat (optional scheduled tasks placeholder) ───────────────────
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info
    environment:
      <<: *backend-env
    depends_on:
      - redis
    profiles:
      - beat  # only started when: docker compose --profile beat up

  # ── Frontend (served as static build) ────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - api

  # ── Nginx reverse proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro  # mount your TLS certs here
    depends_on:
      - api
      - frontend


volumes:
  postgres_data:
  redis_data:
  storage_data:
